{% extends "base.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="ko">
<head>
<script src="https://cdn.jsdelivr.net/npm/ag-grid-community/dist/ag-grid-community.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.0/styles/ag-grid.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community@31.0.0/styles/ag-theme-alpine.css">

</head>
<style>
    /* 좌측 사이드바 스타일 커스텀 */
    .sidebar-menu {
        min-height: calc(100vh - 120px); /* 상단바 제외한 높이 전체 사용 */
        background-color: #f8f9fa;
        border-right: 1px solid #dee2e6;
    }
    .sidebar-menu .nav-link {
        color: #333;
        padding: 12px 20px;
        border-bottom: 1px solid #e9ecef;
        font-weight: 500;
    }
    .sidebar-menu .nav-link:hover {
        background-color: #e9ecef;
        color: #007bff;
    }
    .sidebar-menu .nav-link.active {
        background-color: #007bff;
        color: #fff;
    }
    /* 우측 콘텐츠 영역 */
    .content-area {
        padding: 30px;
    }
</style>

<div class="container-fluid">
    <div class="row">
        <nav class="col-md-3 col-lg-2 d-md-block sidebar-menu p-0">
            <div class="position-sticky pt-3">
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link active" href="#" onclick="switchMenu('issued')">발급대장</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="switchMenu('receipt')">접수대장</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="switchMenu('sample')">시료관리대장</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#" onclick="switchMenu('report')">시험검사실적표</a>
                    </li>
                </ul>
            </div>
        </nav>

        <main class="col-md-9 ms-sm-auto col-lg-10 content-area">
    
    <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
        <h1 class="h2 mb-0 flex-shrink-0" id="page-title">발급대장 내역</h1>
        
        <div class="d-flex align-items-center flex-wrap gap-2 ms-auto">
            
            <div class="d-flex align-items-center gap-1">
                <span id="date-label" class="text-secondary font-weight-bold" style="font-size: 14px; min-width: 50px; text-align: right;">발급일:</span>
                <input type="date" class="form-control form-control-sm" id="start-date" style="width: 140px;">
                <span class="text-secondary">~</span>
                <input type="date" class="form-control form-control-sm" id="end-date" style="width: 140px;">
            </div>

            <div class="d-flex align-items-center gap-1 ms-2">
                <select class="form-select form-select-sm" id="search-type" style="width: 120px;">
                    <option value="client_name">의뢰기관명</option>
                    <option value="project_name">공사명</option>
                    <option value="remark_management_no">관리번호</option>
                </select>
                <input type="text" class="form-control form-control-sm" id="search-keyword" placeholder="검색어 입력..." style="width: 150px;">
            </div>

            <div class="d-flex align-items-center gap-1 ms-3">
                <button class="btn btn-primary btn-sm px-2" onclick="searchData()">
                    🔍 검색
                </button>
                
                <div class="vr mx-1" style="height: 20px;"></div> <button class="btn btn-info btn-sm text-white px-2" onclick="fetchCsiData()">
                    🌐 CSI 조회
                </button>
                <button class="btn btn-warning btn-sm text-white px-2" onclick="matchSqlManagementNo()">
                    🔗 SQL DB 매칭
                </button>
                <button class="btn btn-secondary btn-sm px-2" onclick="saveToMysql()">
                    💾 MySQL DB 저장
                </button>

                <div class="vr mx-1" style="height: 20px;"></div> <button class="btn btn-success btn-sm px-2" onclick="exportToExcel()">
                    📄 엑셀 다운로드
                </button>
            </div>

        </div>
    </div>

    <div id="myGrid" class="ag-theme-alpine" style="height: 600px; width: 100%;"></div>
</main>
    </div>
</div>

<script>
    // 전역 변수로 grid 객체 선언
    let evaluationGrid;
    // ==========================================
    // 1. 각 대장별 컬럼 정의 (Column Definitions)
    // ==========================================
   // 체크박스 컬럼 정의
    const URL_ISSUED = "{% url 'search_issued_ledger' %}";
    const URL_RECEIPT = "{% url 'get_receipt_data' %}";
    const checkboxColumn = {
        headerName: "",
        field: "checkbox",
        width: 40,
        maxWidth: 40,
        checkboxSelection: true,         // 각 행에 체크박스 표시
        headerCheckboxSelection: true,  // 헤더에 전체 선택 체크박스 표시
        showDisabledCheckboxes: true,
        pinned: 'left'                  // 왼쪽에 고정
    };
    // [1] 발급대장 컬럼
    const issuedColumnDefs = [
        checkboxColumn, // 🔥 추가       
        { field: "receipt_no",         headerName: "접수번호",    width: 130, filter: 'agTextColumnFilter', sortable: true },
        { field: "cert_no",            headerName: "발급번호",    width: 130, filter: 'agTextColumnFilter', sortable: true },
        { field: "issue_date",         headerName: "발급일",    width: 120, filter: 'agDateColumnFilter', sortable: true },
        { field: "seal_name",          headerName: "재료명",      width: 150, filter: 'agTextColumnFilter' },
        { field: "agency",             headerName: "의뢰업체명",  width: 180, filter: 'agTextColumnFilter' },
        { field: "project_name",       headerName: "공사명",      width: 220, filter: 'agTextColumnFilter' },
        { field: "tester",             headerName: "시험검사자",  width: 110, filter: 'agTextColumnFilter' },
        { field: "technical_leader",   headerName: "책임기술인",  width: 110, filter: 'agTextColumnFilter' },
        { field: "remark_management_no", headerName: "비고(관리번호)", width: 150, filter: 'agTextColumnFilter' },
        { field: "req_no",             headerName: "의뢰번호",    width: 140, filter: 'agTextColumnFilter', sortable: true },
        { field: "test_item",          headerName: "시험검사종목", width: 150, filter: 'agTextColumnFilter' },
        { field: "test_standard",      headerName: "시험검사기준", width: 150, filter: 'agTextColumnFilter' },
        { field: "receive_date",       headerName: "접수일시",    width: 150, filter: 'agTextColumnFilter' }
];

    const receiptColumnDefs = [ 
        checkboxColumn, // 🔥 추가      
        { field: "receipt_no",         headerName: "접수번호",     width: 140, filter: 'agTextColumnFilter', sortable: true },
        { field: "receipt_date",       headerName: "접수일",       width: 130, filter: 'agDateColumnFilter', sortable: true },
        { field: "agency",             headerName: "의뢰업체명",   width: 180, filter: 'agTextColumnFilter' },
        { field: "project_name",       headerName: "공사명",       width: 240, filter: 'agTextColumnFilter' },
        { field: "seal_name",          headerName: "재료명",       width: 160, filter: 'agTextColumnFilter' },
        { field: "sample_quantity",    headerName: "시료량",       width: 110, filter: 'agTextColumnFilter' },
        { field: "remark_management_no", headerName: "비고(관리번호)", width: 150, filter: 'agTextColumnFilter' },
        { field: "req_no",             headerName: "의뢰번호",     width: 140, filter: 'agTextColumnFilter', sortable: true } // 🔥 추가
    ];

    const sampleColumnDefs = [ 
        checkboxColumn, // 🔥 추가       
        { field: "receipt_no",         headerName: "접수번호",     width: 130, filter: 'agTextColumnFilter', sortable: true },
        { field: "receive_date",       headerName: "접수일",       width: 120, filter: 'agDateColumnFilter', sortable: true },
        { field: "issue_date",         headerName: "발급일",     width: 120, filter: 'agDateColumnFilter', sortable: true },
        { field: "agency",             headerName: "의뢰업체명",   width: 160, filter: 'agTextColumnFilter' },
        { field: "project_name",       headerName: "공사명",       width: 200, filter: 'agTextColumnFilter' },
        { field: "seal_name",          headerName: "재료명",       width: 140, filter: 'agTextColumnFilter' },
        { field: "sample_quantity",    headerName: "시료량",       width: 100, filter: 'agTextColumnFilter' },
        { field: "used_quantity",      headerName: "사용량",       width: 100, filter: 'agTextColumnFilter' },
        { field: "remaining_quantity", headerName: "남은량",       width: 100, filter: 'agTextColumnFilter' },
        { field: "disposal_date",      headerName: "폐기일",       width: 120, filter: 'agDateColumnFilter', sortable: true },
        { field: "remark_management_no", headerName: "비고(관리번호)", width: 150, filter: 'agTextColumnFilter' },
        { field: "req_no",             headerName: "의뢰번호",     width: 140, filter: 'agTextColumnFilter', sortable: true } // 🔥 추가
    ];

    const reportColumnDefs = [ 
        checkboxColumn, // 🔥 추가       
        { field: "seq_no",             headerName: "연번",         width: 80,  filter: 'agNumberColumnFilter', sortable: true },
        { field: "receive_date",       headerName: "의뢰연월일",   width: 120, filter: 'agDateColumnFilter', sortable: true },
        { field: "agency",             headerName: "의뢰자",   width: 160, filter: 'agTextColumnFilter' },
        { field: "project_name",       headerName: "공사명",       width: 200, filter: 'agTextColumnFilter' },
        { field: "seal_name",          headerName: "시료명",       width: 130, filter: 'agTextColumnFilter' },
        { field: "test_item",          headerName: "시험검사종목", width: 150, filter: 'agTextColumnFilter' },
        { field: "test_standard",      headerName: "시험검사기준", width: 150, filter: 'agTextColumnFilter' },
        { field: "test_result",        headerName: "시험결과",     width: 110, filter: 'agTextColumnFilter' },
        { field: "fee",                headerName: "수수료",       width: 110, filter: 'agNumberColumnFilter', sortable: true, valueFormatter: params => params.value ? params.value.toLocaleString() : '0' },
        { field: "tester",             headerName: "시험검사자",   width: 110, filter: 'agTextColumnFilter' },
        { field: "technical_leader",   headerName: "책임기술인",   width: 110, filter: 'agTextColumnFilter' },
        { field: "issue_date",         headerName: "처리연월일",     width: 120, filter: 'agDateColumnFilter', sortable: true },
        { field: "remark_management_no", headerName: "비고(관리번호)", width: 150, filter: 'agTextColumnFilter' },
        { field: "req_no",             headerName: "의뢰번호",     width: 140, filter: 'agTextColumnFilter', sortable: true } // 🔥 추가
    ];

    


    // ==========================================
    // 2. 각 대장별 UI 확인용 가상 데이터 (Row Data)
    // ==========================================

    // 초기 가상 테스트 데이터 구조 싱크업
    const dummyIssuedData = [        
        {  "checkbox": "", "receipt_no": "", "cert_no": "", "issue_date": "", "seal_name": "", "agency": "", "project_name": "", "tester": "", "technical_leader": "", "remark_management_no": "", "req_no": "" }
    ];

    const dummyReceiptData = [
        {   "checkbox": "", 
            "receipt_no": "AC-2026-090078", 
            "receipt_date": "2026-06-01", 
            "agency": "(주)씨앤비", 
            "project_name": "평촌처리분구 우오수 분류식화사업(호계1동)", 
            "seal_name": "되메우기용 흙(현장밀도)", 
            "sample_quantity": "", 
            "remark_management_no": "",
            "req_no": "RQ-2026-095399" 
        }
    ];

    const dummySampleData = [
        { "checkbox": "", "receipt_no": "", "receipt_date": "", "issue_date": "", "agency": "", "project_name": "", "seal_name": "", "sample_quantity": "", "used_quantity": "", "remaining_quantity": "", "disposal_date": "", "remark_management_no": "" }
    ]; 

    // [추가됨] 시험검사실적표 가상 데이터
    const dummyReportData = [
        {   "checkbox": "",
            "seq_no": 1,
            "request_date": "",
            "agency": "",
            "project_name": "",
            "seal_name": "",
            "test_item": "",
            "test_standard": "",
            "test_result": "",
            "fee": 0,
            "tester": "",
            "technical_leader": "",
            "issue_date": "",
            "remark_management_no":"",
            "req_no": ""
        }
    ];


    // ==========================================
    // 3. 페이지 초기 로드 및 그리드 생성
    // ==========================================
    document.addEventListener('DOMContentLoaded', function () {
        const gridOptions = {
            columnDefs: issuedColumnDefs, // 첫 화면 기본값: 발급대장
            rowSelection: 'multiple',
            rowData: dummyIssuedData,
            enableCellTextSelection: true, // 💡 마우스 드래그로 셀 안의 텍스트를 선택(블록 지정)할 수 있게 합니다.
            ensureDomOrder: true,          // 💡 텍스트를 드래그할 때 순서가 뒤죽박죽되지 않고 화면에 보이는 순서대로 이쁘게 긁히도록 보장합니다.
            pagination: true,
            getRowId: (params) => {
            // 접수번호가 있다면 접수번호를, 없다면 의뢰번호를 ID로 사용
            return params.data.receipt_no || params.data.req_no;
        },
            paginationPageSize: 20,
            paginationPageSizeSelector: [10, 20, 50, 100],
            defaultColDef: {
                resizable: true,
                flex: 1,
                minWidth: 90
            }
        };

        const gridDiv = document.querySelector('#myGrid');
        evaluationGrid = agGrid.createGrid(gridDiv, gridOptions);
        window.myGridApi = evaluationGrid;
    });


    // ==========================================
    // 4. 좌측 사이드 메뉴 전환 함수
    // ==========================================
    function switchMenu(menuType) {
        // 사이드바 active 스타일 제어
        const links = document.querySelectorAll('.sidebar-menu .nav-link');
        links.forEach(link => link.classList.remove('active'));
        event.currentTarget.classList.add('active');

        const titleEl = document.getElementById('page-title');
        
        if (!evaluationGrid) return;

        // 메뉴 선택에 따른 그리드 스위칭
        if(menuType === 'issued') {
            titleEl.innerText = "발급대장 내역";
            evaluationGrid.setGridOption('columnDefs', issuedColumnDefs);
            evaluationGrid.setGridOption('rowData', dummyIssuedData);
            
        } else if(menuType === 'receipt') {
            titleEl.innerText = "접수대장 내역";
            evaluationGrid.setGridOption('columnDefs', receiptColumnDefs);
            evaluationGrid.setGridOption('rowData', dummyReceiptData);
            
        } else if(menuType === 'sample') {
            titleEl.innerText = "시료관리대장 내역";
            evaluationGrid.setGridOption('columnDefs', sampleColumnDefs);
            evaluationGrid.setGridOption('rowData', dummySampleData);
            
        } else if(menuType === 'report') {
            // 💡 [수정됨] 시험검사실적표 클릭 시 변환 로직 연결
            titleEl.innerText = "시험검사실적표 내역";
            evaluationGrid.setGridOption('columnDefs', reportColumnDefs);
            evaluationGrid.setGridOption('rowData', dummyReportData);
        }
    }

    // 불러오기 등 버턴제어

    // 1. 내부 MySQL에 이미 저장된 과거 대장 데이터 불러오기 및 검색용
async function searchData() {
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const titleEl = document.getElementById('page-title');
    const currentTitle = titleEl ? titleEl.innerText.trim() : "";

    if (!startDate || !endDate) {
        alert("조회할 날짜 범위를 먼저 지정해주세요.");
        return;
    }

    if (evaluationGrid) evaluationGrid.showLoadingOverlay();

    try {
        let apiUrl = "";
        let columns = []; 
        let dateType = "issue"; // 💡 기본값은 '발급일 기준(issue)'으로 설정

        // 1. 대장별 설정값 정의 (API 경로, 컬럼, 날짜 기준)
        switch (currentTitle) {
            case "발급대장 내역":
                apiUrl = URL_ISSUED;
                dateType = "issue"; // 발급일 기준
                columns = [
                    checkboxColumn,
                    { field: "receipt_no", headerName: "접수번호", width: 130 },
                    { field: "cert_no", headerName: "발급번호", width: 130 },
                    { field: "issue_date", headerName: "발급일", width: 120 },
                    { field: "seal_name", headerName: "재료명", width: 150 },
                    { field: "agency", headerName: "의뢰업체명", width: 180 },
                    { field: "project_name", headerName: "공사명", width: 220 },
                    { field: "tester", headerName: "시험검사자", width: 110 },
                    { field: "technical_leader", headerName: "책임기술인", width: 110 },
                    { field: "remark_management_no", headerName: "비고(관리번호)", width: 150 }
                ];
                break;

            case "접수대장 내역":
                apiUrl = URL_RECEIPT;
                dateType = "receipt"; // 💡 접수대장만 '접수일 기준(receipt)'으로 변경!
                columns = receiptColumnDefs;
                break;

            case "시료관리대장 내역":
                apiUrl = "/api/search-sample-ledger/"; 
                dateType = "issue"; // 발급일 기준
                columns = sampleColumnDefs;
                break;

            case "시험검사실적표 내역":
                apiUrl = "/api/get-performance-data/"; 
                dateType = "issue"; // 발급일 기준
                columns = reportColumnDefs; 
                break;    

            default:
                alert("현재 화면에서는 검색 기능을 지원하지 않습니다.");
                if (evaluationGrid) evaluationGrid.hideOverlay();
                return;
        }

        // 💡 2. 파라미터 구성에 날짜 기준 플래그(date_type)를 포함시킵니다.
        const searchParams = { 
            start_date: startDate, 
            end_date: endDate,
            date_type: dateType // 백엔드에서 'issue' 또는 'receipt'를 받아 분기 처리 가능
        };

        // 3. 그리드 옵션 적용
        if (evaluationGrid) {
            evaluationGrid.setGridOption('columnDefs', columns);
        }

        // 4. 서버 데이터 요청
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'X-CSRFToken': getCookie('csrftoken') 
            },
            body: JSON.stringify(searchParams)
        });

        const data = await response.json();

        // 5. 결과 처리
        if (data.status === 'success') {
            if (evaluationGrid) {
                evaluationGrid.setGridOption('rowData', data.results);
                evaluationGrid.hideOverlay();
                if (data.results.length === 0) evaluationGrid.showNoRowsOverlay();
            }
        } else {
            throw new Error(data.message);
        }

    } catch (e) {
        console.error(e);
        alert("조회 실패: " + e.message);
        if (evaluationGrid) evaluationGrid.hideOverlay();
    }
}

// 2. 외부 CSI 사이트 원격 데이터 크롤링/가져오기 요청
// 🌐 [1단계] CSI 대장 조회 비동기 함수 구현
async function fetchCsiData() {
    const startDate = document.getElementById('start-date').value;
    const endDate = document.getElementById('end-date').value;
    const titleEl = document.getElementById('page-title');
    const currentTitle = titleEl ? titleEl.innerText.trim() : "";

    // 1. 유효성 및 권한 검사
    const allowedTitles = ["발급대장 내역", "접수대장 내역"];
    if (!titleEl || !allowedTitles.includes(currentTitle)) {
        alert("CSI 조회는 '발급대장' 또는 '접수대장' 화면에서만 가능합니다.");
        return;
    }

    if (!startDate || !endDate) {
        alert("조회할 날짜 범위를 먼저 지정해 주세요.");
        return;
    }

    if (!confirm(`${currentTitle}에 대한 CSI 원격 조회를 시작하시겠습니까?`)) return;

    if (evaluationGrid) evaluationGrid.showLoadingOverlay();

    try {
        // 2. 대장별 API 분기 처리
        let apiUrl = "";
        switch (currentTitle) {
            case "발급대장 내역":
                apiUrl = "{% url 'fetch_csi_released_ledger_data' %}";
                break;
            case "접수대장 내역":
                apiUrl = "{% url 'search_receipt_ledger' %}"; // 👈 여기 접수대장용 URL 등록
                break;
        }

        // 3. 서버 데이터 요청
        const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json', 
                'X-CSRFToken': '{{ csrf_token }}' 
            },
            body: JSON.stringify({ start_date: startDate, end_date: endDate })
        });
        
        const data = await response.json();
        
        // 4. 결과 처리 (로직이 같다면 통합 가능)
        if (data.status === 'success') {
            if (data.results.length === 0) {
                alert("조회 기간 내 수집된 데이터가 없습니다.");
                if (evaluationGrid) evaluationGrid.showNoRowsOverlay();
                return;
            }
            alert(`${data.results.length}건의 CSI 데이터를 성공적으로 파싱했습니다.`);
            if (evaluationGrid) {
                evaluationGrid.setGridOption('rowData', data.results);
                evaluationGrid.hideOverlay();
            }
        } else {
            throw new Error(data.message);
        }
    } catch (e) {
        alert("원격 연동 에러: " + e.message);
        if (evaluationGrid) evaluationGrid.hideOverlay();
    }
}

// 3. 화면에 로드된 데이터의 접수번호를 기반으로 레거시 SQL DB에서 관리번호 찾아와 매핑
function matchSqlManagementNo() {
    if (!evaluationGrid) { alert("그리드 객체 없음"); return; }

    // 1. 데이터 수집 및 비어있는지 체크
    const rowData = [];
    evaluationGrid.forEachNode(node => rowData.push(node.data));

    if (rowData.length === 0) {
        alert("데이터가 없습니다. 먼저 조회 후 매칭을 진행해주세요.");
        return;
    }

    // 2. 의뢰번호 또는 관리번호(매칭 키)가 하나라도 있는지 확인
    // 시료관리대장 등에서는 remark_management_no가 매칭 키이므로 같이 체크합니다.
    const hasMatchKey = rowData.some(row => 
        (row.req_no && row.req_no.toString().trim() !== "") || 
        (row.remark_management_no && row.remark_management_no.toString().trim() !== "")
    );

    if (!hasMatchKey) {
        alert("매칭할 데이터(의뢰번호 또는 관리번호)가 없습니다. 검색(조회) 후에 매칭을 시도해주세요.");
        return;
    }

    // 3. 현재 대장 이름 파악
    const titleEl = document.getElementById('page-title');
    const currentTitle = titleEl ? titleEl.innerText.trim() : "";
    
    // 4. 대장별 API 경로 및 설정
    const configMap = {
        "발급대장 내역": { url: "/api/match-management-no/issued/", type: "issued" },
        "접수대장 내역": { url: "/api/match-management-no/receipt/", type: "receipt" },
        "시료관리대장 내역": { url: "/api/match-management-no/sample/", type: "sample" },
        "시험검사실적표 내역": { url: "/api/match-management-no/performance/", type: "performance" }
    };

    const config = configMap[currentTitle];
    if (!config) {
        alert("알 수 없는 대장입니다. 타이틀 확인이 필요합니다.");
        return;
    }

    // 5. 분기된 API 호출
    fetch(config.url, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json', 
            'X-CSRFToken': getCookie('csrftoken') 
        },
        body: JSON.stringify({ items: rowData, ledger_type: config.type })
    })
    .then(response => response.json())
    .then(data => {
        const isSuccess = data.success === true || data.status === 'success';
        const updatedRows = data.updated_rows || data.results;

        if (isSuccess && updatedRows) {
            const api = evaluationGrid.api || evaluationGrid;
            api.applyTransaction({ update: updatedRows });
            alert(`${currentTitle} 매칭 완료!`);
        } else {
            alert("매칭 실패: " + (data.message || "매칭할 수 있는 데이터가 없습니다."));
        }
    })
    .catch(error => {
        console.error("통신 에러:", error);
        alert("통신 중 오류가 발생했습니다.");
    });
}

// CSRF 토큰을 가져오는 함수 (이게 없어서 fetch가 멈춘 것입니다)
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

// 여기서부터 엑셀 다운로드 처리--------------------------------------------------------

function exportToExcel() {
    if (!evaluationGrid) { 
        alert("그리드 객체가 존재하지 않습니다."); 
        return; 
    }

    // 1. 현재 그리드 화면에 '필터 및 정렬'되어 표시된 데이터만 추출
    const rowData = [];
    const api = evaluationGrid.api || evaluationGrid;
    
    api.forEachNodeAfterFilterAndSort(node => {
        if (node.data) {
            rowData.push(node.data);
        }
    });

    if (rowData.length === 0) {
        alert("엑셀로 추출할 데이터가 없습니다. 먼저 조회를 진행해주세요.");
        return;
    }

    // 2. 현재 대장 이름 파악
    const titleEl = document.getElementById('page-title');
    const currentTitle = titleEl ? titleEl.innerText.trim() : "";
    
    // 3. 대장별 API 경로 식별자 및 다운로드될 파일명 매핑
    const configMap = {
        "발급대장 내역": { type: "issued", filename: "발급대장_내역.xlsx" },
        "접수대장 내역": { type: "receipt", filename: "접수대장_내역.xlsx" },
        "시료관리대장 내역": { type: "sample", filename: "시료관리대장_내역.xlsx" },
        "시험검사실적표 내역": { type: "performance", filename: "시험검사실적표_내역.xlsx" }
    };

    const config = configMap[currentTitle];
    if (!config) {
        alert("알 수 없는 대장 양식입니다. 페이지 타이틀을 확인해주세요.");
        return;
    }

    if (!confirm(`현재 화면에 표시된 ${rowData.length}건을 엑셀로 다운로드하시겠습니까?`)) return;

    // 4. 백엔드 통합 엔드포인트로 요청 호출
    const targetUrl = `/api/export-excel/${config.type}/`;

    fetch(targetUrl, {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json', 
            'X-CSRFToken': getCookie('csrftoken') 
        },
        body: JSON.stringify({ items: rowData })
    })
    .then(async response => {
        // 백엔드에서 에러(500 등)가 발생했을 때 에러 메시지 가독성을 높임
        if (!response.ok) {
            const errText = await response.text();
            throw new Error(`HTTP ${response.status}: ${errText}`);
        }
        return response.blob(); // 응답을 바이너리 파일(Blob) 형태로 받음
    })
    .then(blob => {
        // 가상 링크를 생성하여 브라우저 다운로드 실행
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = config.filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url); // 메모리 누수 방지
    })
    .catch(error => {
        console.error("엑셀 다운로드 오류 상세:", error);
        alert("엑셀 다운로드 중 오류가 발생했습니다. 콘솔 창(F12)을 확인해주세요.");
    });
}
