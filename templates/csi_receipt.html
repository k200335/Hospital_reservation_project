window.handleExcelImport = function(event) {
    if (event) {

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.xlsx, .xls';

    fileInput.onchange = function(e) {

                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];

                const jsonData = XLSX.utils.sheet_to_json(worksheet, { 
                    range: 3, 
                    defval: '' 
                });

                const tbody = document.getElementById('table-body');
                if (tbody) tbody.innerHTML = ''; 

                jsonData.forEach((row) => {
                    if (!row['의뢰번호']) return;

                        sampler: row['채취자'] || '',

                        manager_info: row['현장 담당자'] || '',

                        assign_status: row['배정현황'] || ''
                    };

                    tr.innerHTML = `
                        <td><input type="checkbox" class="form-check-input row-checkbox"></td>
                        <td><input type="text" class="edit-input" data-name="index" value="${map.index}"></td>
                        <td><input type="text" class="edit-input" data-name="u_id" value="${map.u_id}"></td>
                        <td><input type="text" class="edit-input" data-name="receipt_id" value="${map.receipt_id}"></td> 
                        <td><input type="text" class="edit-input" data-name="receipt_date" value="${map.receipt_date}"></td> 
                        <td><input type="text" class="edit-input" data-name="status" value="${map.status}"></td>
                        <td><input type="text" class="edit-input" data-name="project" value="${map.project}"></td> 
                        <td><input type="text" class="edit-input" data-name="client" value="${map.client}"></td> 
                        <td><input type="text" class="edit-input" data-name="sampler" value="${map.sampler}"></td> 
                        <td><input type="text" class="edit-input" data-name="seal" value="${map.seal}"></td> 
                        <td><input type="text" class="edit-input" data-name="processor" value="${map.processor}"></td> 
                        <td><input type="text" class="edit-input" data-name="sales_type" value="${map.sales_type}"></td> 
                        <td>
                            <select class="edit-input team-select" data-name="manager" onchange="changeTeamColor(this)">
                                <option value="">선택</option>
                                ${['1팀','2팀','3팀','4팀','5팀','6팀'].map(t => 
                                    `<option value="${t}" ${map.team.includes(t) ? 'selected' : ''}>${t}</option>`
                                ).join('')}
                            </select>
                        </td>
                        <td><input type="text" class="edit-input" data-name="check_col" value="${map.check}"></td> 
                        <td><input type="text" class="edit-input" data-name="amount" value="${map.amount}"></td> 
                        <td><input type="text" class="edit-input" data-name="type_col" value="${map.type}"></td> 
                        <td><input type="text" class="edit-input" data-name="manager_name" value="${map.manager_info}"></td> 
                        <td>
                            <input type="date" class="edit-input date-picker" data-name="assign_date" 
                                   value="${typeof formatDateToISO === 'function' ? formatDateToISO(map.assign_date) : map.assign_date}"
                                   onchange="this.style.backgroundColor='#99ff99'">
                        </td>
                        <td><input type="text" class="edit-input" data-name="assignment_history" value="${map.assign_status}"></td>`;
                    
                    if (tbody) tbody.appendChild(tr);
                });

                if (typeof overlay !== 'undefined') overlay.style.display = 'none';

                // ⭐ [핵심 수정] 0.1초 뒤에 알림창을 띄워 브라우저를 강제로 앞으로 소환합니다.
                setTimeout(() => {
                    window.focus();
                    alert("엑셀 데이터를 성공적으로 불러왔습니다.");
                }, 100);

                if (typeof overlay !== 'undefined') overlay.style.display = 'none';
                console.error(err);
                window.focus();
                alert("불러오기 실패: " + err.message);
            }
        };

    };

// 2. CSI 불러오기 (데이터 매핑 정확도 개선 버전)
window.fetchCsiData = function(event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation();
    }

    const selected = document.querySelectorAll('.row-checkbox:checked');
    if (selected.length === 0) return alert("대상을 선택해주세요.");

    const rqNumbers = [];
    const targetRows = [];
    
    selected.forEach(cb => {
        const row = cb.closest('tr');
        // data-name="u_id"인 요소를 찾아 의뢰번호 추출
        const rqInput = row.querySelector('[data-name="u_id"]');
        const rq = rqInput ? rqInput.value.trim() : "";
        
        if (rq) { 
            rqNumbers.push(rq); 
            targetRows.push(row); 
        }
    });

    if (rqNumbers.length === 0) return alert("선택된 행에 의뢰번호가 없습니다.");

    overlay.style.display = 'flex';
    loadingText.innerText = "CSI 데이터를 가져오는 중입니다...\n(서버 상태에 따라 1분 이상 소요될 수 있습니다.)";
    progressBar.style.width = '20%';

    fetch("{% url 'fetch_csi_data' %}", { 
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json', 
            'X-CSRFToken': '{{ csrf_token }}' 
        },
        body: JSON.stringify({ rq_numbers: rqNumbers })
    })
    .then(res => {
        if (!res.ok) throw new Error('서버 응답 오류 (URL 설정 또는 서버 상태 확인)');
        return res.json();
    })
    .then(data => {
        if (data.status === 'success') {
            data.results.forEach((resData, idx) => {
                const row = targetRows[idx];
                
                // data-name 속성을 기반으로 정확한 위치에 값 입력
                // 백엔드 순서: [0:접수번호, 1:접수일시, 2:상태, 3:사업명, 4:의뢰기관, 5:채취자, 6:봉인명, 7:처리자]
                const mapping = [
                    { name: 'receipt_id',   value: resData[0] },
                    { name: 'receipt_date', value: resData[1] },
                    { name: 'status',       value: resData[2] },
                    { name: 'project',      value: resData[3] },
                    { name: 'client',       value: resData[4] },
                    { name: 'sampler',      value: resData[5] },
                    { name: 'seal',         value: resData[6] },
                    { name: 'processor',    value: resData[7] }
                ];

                mapping.forEach(item => {
                    const targetInput = row.querySelector(`[data-name="${item.name}"]`);
                    if (targetInput) {
                        targetInput.value = item.value || "";
                        // 값이 변경되었음을 알리기 위해 노란색으로 잠시 강조 (선택 사항)
                        targetInput.style.backgroundColor = "#fff3cd";
                    }
                });
            });
            
            progressBar.style.width = '100%';
            setTimeout(() => { 
                overlay.style.display = 'none'; 
                alert(data.message || "성공적으로 불러왔습니다."); 
            }, 300);
        } else {
            throw new Error(data.message);
        }
    })
    .catch(err => {
        overlay.style.display = 'none';
        alert("실패 사유: " + err.message);
    });
};



function formatDateToISO(val) {
    if (!val) return '';
    const date = new Date(val);
    if (isNaN(date.getTime())) return val;
    
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
}

                "3팀": "#33ccff", // 하늘

                "5팀": "#c0c0c0", // 회색
                "6팀": "#ffeb9c"  // 연주황
            };

// 3. 담당자 배정현황 불러오기 (MySQL 조회)
   window.fetchAssignmentHistory = function(event) {
    if (event) event.preventDefault();

    const rows = document.querySelectorAll('#table-body tr');
    const items = [];
    const targetRows = [];

    rows.forEach((row) => {
        // 'data-name' 속성으로 정확한 값들을 추출
        const projectInput = row.querySelector('[data-name="project"]');
        const clientInput = row.querySelector('[data-name="client"]');
        const uidInput = row.querySelector('[data-name="u_id"]'); // ⭐ 의뢰번호(u_id) 추가 수집
        
        const project = projectInput ? projectInput.value.trim() : "";
        const client = clientInput ? clientInput.value.trim() : "";
        const u_id = uidInput ? uidInput.value.trim() : "";

        // 사업명과 기관명이 있을 때만 목록에 추가
        if (project && client) {
            // ⭐ 서버로 u_id를 함께 보내서 저장 여부를 확인합니다.
            items.push({ project: project, client: client, u_id: u_id });
            targetRows.push(row);
        }
    });

    if (items.length === 0) return alert("조회할 사업명/기관명 데이터가 행에 없습니다.");

    overlay.style.display = 'flex';
    loadingText.innerText = `과거 이력 및 DB 저장 여부 확인 중...`; // 텍스트 변경
    progressBar.style.width = '30%';

    fetch("{% url 'fetch_assignment_history' %}", {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}' 
        },
        body: JSON.stringify({ items: items })
    })
    .then(res => res.json())
    .then(data => {
        if (data.status === 'success') {
            data.results.forEach((res, idx) => {
                const currentRow = targetRows[idx];
                const rowInputs = currentRow.querySelectorAll('input.edit-input');
                const checkbox = currentRow.querySelector('.row-checkbox');
                
                // 1. 배정현황(이력) 값을 넣습니다.
                const lastIdx = rowInputs.length - 1;
                if (rowInputs[lastIdx]) {
                    rowInputs[lastIdx].value = res.history || "이력 없음";
                    rowInputs[lastIdx].style.color = "blue";
                    rowInputs[lastIdx].style.fontWeight = "bold";
                }

                // 2. ⭐ DB에 이미 저장된 데이터인 경우 시각적 변화 적용
                if (res.is_saved) {
                    currentRow.style.backgroundColor = '#f8f9fa'; // 연한 회색 배경
                    currentRow.style.opacity = '0.7';            // 약간 투명하게
                    
                    if (checkbox) {
                        checkbox.checked = false;        // 체크박스 해제
                        checkbox.disabled = true;        // 중복 저장 방지를 위해 비활성화
                    }

                    // 선택사항: 저장된 데이터는 실수로 수정하지 못하도록 입력창 잠금
                    currentRow.querySelectorAll('input, select').forEach(el => {
                        // 배정현황 칸만 빼고 모두 읽기 전용 처리
                        if (el.getAttribute('data-name') !== 'assignment_history') {
                            el.readOnly = true;
                            if(el.tagName === 'SELECT') el.style.pointerEvents = 'none';
                        }
                    });
                }
            });

            progressBar.style.width = '100%';
            setTimeout(() => {
                overlay.style.display = 'none';
                const savedCount = data.results.filter(r => r.is_saved).length;
                alert(`${data.results.length}건 조회 완료!\n(이미 저장된 데이터 ${savedCount}건은 회색으로 표시됩니다.)`);
            }, 300);
        }
    })
    .catch(err => {
        overlay.style.display = 'none';
        alert("에러: " + err.message);
    });
}; 
    

// 4. DB 저장하기 (MySQL에 데이터 최종 기록)
window.handleSaveToDB = function(event) {
    if (event) {
        event.preventDefault();
        event.stopPropagation(); // 이벤트 전파 방지 추가
    }
    
    const selected = document.querySelectorAll('.row-checkbox:checked');
    if (selected.length === 0) {
        alert("저장할 항목을 선택해주세요.");
        return;
    }

    if (!confirm(`선택한 ${selected.length}건의 데이터를 저장하시겠습니까?`)) {
        return;
    }

    const saveData = [];
    selected.forEach(cb => {
        const row = cb.closest('tr');
        if (!row) return;

        const rowData = {
            u_id: row.querySelector('[data-name="u_id"]')?.value || "",
            receipt_id: row.querySelector('[data-name="receipt_id"]')?.value || "",
            receipt_date: row.querySelector('[data-name="receipt_date"]')?.value || "",
            status: row.querySelector('[data-name="status"]')?.value || "",
            project: row.querySelector('[data-name="project"]')?.value || "",
            client: row.querySelector('[data-name="client"]')?.value || "",
            sampler: row.querySelector('[data-name="sampler"]')?.value || "",
            seal: row.querySelector('[data-name="seal"]')?.value || "",
            processor: row.querySelector('[data-name="processor"]')?.value || "",
            sales_type: row.querySelector('[data-name="sales_type"]')?.value || "",
            manager: row.querySelector('[data-name="manager"]')?.value || "", 
            check_col: row.querySelector('[data-name="check_col"]')?.value || "",
            amount: row.querySelector('[data-name="amount"]')?.value || "",
            type_col: row.querySelector('[data-name="type_col"]')?.value || "",
            manager_name: row.querySelector('[data-name="manager_name"]')?.value || "",
            assign_date: row.querySelector('[data-name="assign_date"]')?.value || ""
            // assignment_history: row.querySelector('[data-name="assignment_history"]')?.value || ""
        };
        saveData.push(rowData);
    });

    // 로딩 표시
    if (typeof overlay !== 'undefined') overlay.style.display = 'flex';
    if (typeof loadingText !== 'undefined') loadingText.innerText = "데이터베이스에 저장 중입니다...";

    fetch("{% url 'save_to_csi_receipts' %}", {
        method: 'POST',
        headers: { 
            'Content-Type': 'application/json',
            'X-CSRFToken': '{{ csrf_token }}' 
        },
        body: JSON.stringify({ data: saveData })
    })
    .then(res => {
        if (!res.ok) throw new Error("서버 응답 실패");
        return res.json();
    })
    .then(data => {
        if (data.status === 'success') {
            alert(data.message || "저장되었습니다.");
            selected.forEach(cb => {
                const row = cb.closest('tr');
                row.style.backgroundColor = '#f8f9fa';
                row.style.opacity = '0.6';
                cb.checked = false;
            });
        } else {
            alert("저장 실패: " + data.message);
        }
    })
    .catch(err => {
        console.error(err);
        alert("오류 발생: " + err.message);
    })
    .finally(() => {
        if (typeof overlay !== 'undefined') overlay.style.display = 'none';
    });
}; // <-- 함수는 여기서 딱 한 번만 닫혀야 합니다.

// 여기서 부터 엑셀다운로드 하기 코드입니다.
window.downloadExcel = function() {
    console.log("엑셀 다운로드 함수 시작"); // 실행 여부 확인용

    try {
        // XLSX 라이브러리 로드 확인
        if (typeof XLSX === 'undefined') {
            alert("엑셀 라이브러리가 로드되지 않았습니다. 페이지를 새로고침 해보세요.");
            return;
        }

        const table = document.querySelector(".table");
        if (!table) return alert("다운로드할 테이블이 없습니다.");

        const ws_data = [];
        
        // 2. 헤더(thead) 추출
        const headers = [];
        const ths = table.querySelectorAll("thead th");
        ths.forEach((th, idx) => {
            if (idx === 0) return; // 체크박스 열 제외
            // 텍스트만 깔끔하게 추출 (배정일자의 input 등 제외)
            let headerText = th.innerText.split('\n')[0].replace('📅', '').trim();
            headers.push(headerText);
        });
        ws_data.push(headers);

        // 3. 본문(tbody) 데이터 추출
        const rows = table.querySelectorAll("tbody tr");
        if (rows.length === 0) return alert("다운로드할 데이터가 없습니다.");

        rows.forEach(row => {
            const rowData = [];
            const tds = row.querySelectorAll("td");
            
            tds.forEach((td, idx) => {
                if (idx === 0) return; // 체크박스 열 제외
                
                const input = td.querySelector("input, select");
                if (input) {
                    // input이나 select일 경우 현재 입력된 값을 가져옴
                    rowData.push(input.value || "");
                } else {
                    rowData.push(td.innerText.trim());
                }
            });
            ws_data.push(rowData);
        });

        // 4. 워크북 생성 및 파일 저장
        const wb = XLSX.utils.book_new();
        const ws = XLSX.utils.aoa_to_sheet(ws_data);
        
        // 열 너비 설정
        ws['!cols'] = headers.map(() => ({ wch: 15 }));

        XLSX.utils.book_append_sheet(wb, ws, "의뢰서내역");
        
        const dateStr = new Date().toISOString().slice(0, 10);
        XLSX.writeFile(wb, `의뢰서_내역_${dateStr}.xlsx`);
        console.log("엑셀 다운로드 완료");

    } catch (error) {
        console.error("다운로드 에러 상세:", error);
        alert("다운로드 중 오류가 발생했습니다: " + error.message);
    }
};
